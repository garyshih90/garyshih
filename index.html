<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costco Shopping Lists</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="left-column">
        <header class="hero panel">
          <p class="badge">COSTCO COMPANION</p>
          <h1>Shopping Lists</h1>
          <p class="subtext">Build your trip on the left, then shop from a department-sorted list on the right.</p>
        </header>

        <section class="panel">
          <h2>Checklist</h2>
          <label for="list-select">Saved checklists</label>
          <div class="list-row">
            <select id="list-select"></select>
            <button id="new-list">New</button>
            <button id="delete-list" class="danger">Delete</button>
          </div>
          <div class="list-row">
            <input id="list-name" type="text" placeholder="Checklist name" />
            <button id="rename-list" class="secondary">Rename</button>
          </div>
        </section>

        <section class="panel">
          <h2>Add items from paragraph</h2>
          <textarea
            id="bulk-input"
            placeholder="Example: bananas, bagels, chicken breast, greek yogurt, paper towels"
          ></textarea>
          <div class="actions">
            <button id="parse-button">Parse & Add</button>
            <button id="clear-active" class="secondary">Clear List</button>
          </div>
        </section>

        <section class="panel">
          <h2>Add one item</h2>
          <div class="single-add">
            <input id="single-item" type="text" placeholder="Item name" />
            <button id="add-item">Add</button>
          </div>
        </section>
      </aside>

      <section class="right-column panel" id="list-panel">
        <div class="panel-heading">
          <h2>Items by Department</h2>
          <p class="subtext">Checked items stay in their department and shift to the bottom.</p>
        </div>
        <div id="departments"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
